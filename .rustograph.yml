# rustograph 자기 분석 규칙 — 계층을 한 방향으로 유지한다.
#
#   graph · cfgeval (순수 도메인)
#     ↑ modtree · cargo_meta · harvest (수확 경계 — syn/cargo는 여기만)
#     ↑ source (오케스트레이터)
#     ↑ analysis · rules · export · sarif · config · deps_report (질의/출력)
#     ↑ cli · app (진입점)
#
# deps에 없는 컴포넌트로의 의존은 위반이다. deny가 deps를 이긴다.
components:
  app: ["rustograph"]
  cli: ["rustograph::cli/**"]
  cli_args: ["rustograph::cli_args/**"]
  source: ["rustograph::source/**"]
  cargo_meta: ["rustograph::cargo_meta/**"]
  modtree: ["rustograph::modtree/**"]
  harvest: ["rustograph::harvest/**"]
  graph: ["rustograph::graph/**"]
  analysis: ["rustograph::analysis/**"]
  rules: ["rustograph::rules/**"]
  export: ["rustograph::export/**"]
  sarif: ["rustograph::sarif/**"]
  config: ["rustograph::config/**"]
  mcp: ["rustograph::mcp/**"]
  sem: ["rustograph::sem/**"]
  cfgeval: ["rustograph::cfgeval/**"]
  deps_report: ["rustograph::deps/**"]
deps:
  app: [cli]
  cli: [source, analysis, rules, export, sarif, config, graph, mcp, cli_args, deps_report]
  mcp: [cli_args, analysis, rules, export, config, graph, deps_report]
  cli_args: [source, export, graph]
  source: [graph, harvest, modtree, cargo_meta, sem]
  # sem은 ra_ap 경계 — source만 호출하고, syn 경계·도메인 위층은 모른다.
  sem: [graph, cargo_meta]
  harvest: [graph, modtree]
  analysis: [graph]
  rules: [graph, config]
  export: [graph]
  sarif: [graph, rules]
  cargo_meta: []
  modtree: []
  # cfgeval은 순수 평가기 — graph의 타깃 필터가 쓰는 유일한 소비자다.
  cfgeval: []
  graph: [cfgeval]
  # deps 보고서는 cargo 메타데이터와 수확 그래프를 맞대조한다.
  deps_report: [graph, cargo_meta]
  config: []
deny:
  # 도메인은 수확 경계와 CLI를 절대 모른다 — 순수성이 테스트 가능성이다.
  graph: [cli, source, harvest, modtree, cargo_meta, analysis, rules, export, sarif, config, app, sem]
  # cli는 cargo/syn/ra_ap 경계를 직접 만지지 않는다 — source를 통한다.
  cli: [cargo_meta, harvest, modtree, sem]
  # mcp도 마찬가지 — 수확 경계는 source 뒤에만 있다.
  mcp: [cargo_meta, harvest, modtree, cli, sem]
  # sem은 위층과 syn 경계를 모른다 — source가 정점·간선을 맞춰 넘겨준다.
  sem: [source, harvest, modtree, cli, cli_args, mcp, analysis, rules, export, sarif, config, app]
  # cli_args는 cli/mcp를 모른다 — 파서가 최하층이라 순환이 안 생긴다.
  cli_args: [cli, mcp, cargo_meta, harvest, modtree, analysis, rules, sarif, config, sem]
