[package]
name = "oracle-actix"
version = "0.0.0"
edition = "2021"
publish = false

# lib은 fixture 소스 그대로다 — 오라클이 요청을 보내는 라우터와 rustograph가
# 읽은 선언이 같은 코드에서 나온다.
[lib]
name = "actix_app"
path = "../../../tests/fixture-routes/actix/actix_app/src/lib.rs"

[[bin]]
name = "oracle-actix"
path = "src/main.rs"

[dependencies]
oracle-common = { path = "../common" }
actix-web = "=4.15.0"
actix-http = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
