name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (vX.Y.Z)"
        required: true

# 기본 토큰은 읽기 전용이다. 릴리스와 자산을 쓰는 release 잡만 contents: write를 받는다.
# 게시는 gh와 GH_TOKEN으로 하므로 checkout은 토큰을 .git/config에 남기지 않는다.
# 액션은 커밋 SHA로 고정한다(주석은 고정 시점의 태그) — 갱신은 Dependabot이 제안한다.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      matrix:
        include:
          # 패키지 이름은 계열 공통(go 관례 darwin-amd64), 타깃은 Rust 트리플.
          - { name: darwin-arm64,  os: macos-latest,   target: aarch64-apple-darwin }
          - { name: darwin-amd64,  os: macos-latest,   target: x86_64-apple-darwin }
          - { name: linux-amd64,   os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64,   os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { name: windows-amd64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve version and exact source commit
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          version="${tag#v}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # 소스의 버전과 태그가 어긋나면 cargo install 사용자가 잘못된 값을 본다.
          declared="$(grep -oE '^version = "[^"]+"' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$declared" != "$version" ]; then
            echo "태그($tag)와 Cargo.toml version($declared)이 다릅니다." >&2
            exit 1
          fi

          commit="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$commit" != "$GITHUB_SHA" ]; then
            echo "Checked-out source does not match the tag event commit." >&2
            exit 1
          fi
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Linux arm64 cross linker
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.name != 'windows-amd64'
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          version="$VERSION"
          dir="rustograph-${version}-${NAME}"
          mkdir -p "$dir"
          cp "target/${TARGET}/release/rustograph" "$dir/"
          cp LICENSE README.md "$dir/"
          tar -czf "rustograph-${version}-${NAME}.tar.gz" "$dir"

      - name: Package (windows)
        if: matrix.name == 'windows-amd64'
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $version = $env:VERSION
          $dir = "rustograph-$version-$env:NAME"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/$env:TARGET/release/rustograph.exe" $dir/
          Copy-Item LICENSE, README.md $dir/
          Compress-Archive -Path $dir -DestinationPath "rustograph-$version-$env:NAME.zip"

      - name: Record the built commit and archive digest
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: bash scripts/release-build-manifest.sh record "$VERSION" "$RELEASE_COMMIT" "$NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustograph-${{ matrix.name }}
          path: |
            rustograph-*.tar.gz
            rustograph-*.zip
            rustograph-*.build-info
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Resolve version and exact source commit
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          version="${tag#v}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # 소스의 버전과 태그가 어긋나면 cargo install 사용자가 잘못된 값을 본다.
          declared="$(grep -oE '^version = "[^"]+"' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$declared" != "$version" ]; then
            echo "태그($tag)와 Cargo.toml version($declared)이 다릅니다." >&2
            exit 1
          fi

          commit="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$commit" != "$GITHUB_SHA" ]; then
            echo "Checked-out source does not match the tag event commit." >&2
            exit 1
          fi
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustograph-*
          merge-multiple: true

      - name: Verify all matrix build commits and archive bytes
        run: bash scripts/release-build-manifest.sh verify "$VERSION" "$RELEASE_COMMIT"

      # 배포하기 전에 압축을 푼 그 바이너리로 CLI 계약 전체를 검증한다.
      - name: Verify the packaged binary
        run: |
          tar -xzf "rustograph-${VERSION}-darwin-arm64.tar.gz" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/rustograph-${VERSION}-darwin-arm64/rustograph"
          test "$("$bin" version)" = "rustograph ${VERSION}"
          test "$("$bin" --version)" = "rustograph ${VERSION}"
          cmp README.md "$RUNNER_TEMP/rustograph-${VERSION}-darwin-arm64/README.md"
          scripts/verify-cli-contract.sh "$bin"

      - name: Compute checksums
        run: |
          shasum -a 256 rustograph-*.tar.gz rustograph-*.zip > checksums.txt
          cat checksums.txt

      - name: Publish and verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          \`\`\`bash
          brew install ictechgy/tap/rustograph
          # or
          cargo install --locked --git https://github.com/ictechgy/rustograph --tag ${TAG}
          \`\`\`

          ## Assets

          \`rustograph-${VERSION}-<os>-<arch>.tar.gz\` — macOS (arm64/x86_64), Linux (arm64/x86_64); \`.zip\` for Windows. \`checksums.txt\` has SHA-256 for every asset.
          NOTES
          bash scripts/publish-release-assets.sh "$TAG" "$RELEASE_COMMIT" notes.md

      # tap 저장소는 다른 저장소라 기본 GITHUB_TOKEN으로는 쓸 수 없다.
      # HOMEBREW_TAP_TOKEN 시크릿이 있을 때만 formula를 갱신하고, 없으면 조용히 건너뛴다.
      - name: Update the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          sha() { grep "rustograph-${VERSION}-$1" checksums.txt | cut -d' ' -f1; }
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; update the tap with these values:"
            echo "  version   ${VERSION}"
            for t in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
              echo "  $t  $(sha "$t.tar.gz")"
            done
            exit 0
          fi
          git clone "https://${HOMEBREW_TAP_TOKEN}@github.com/ictechgy/homebrew-tap.git" tap
          # formula 원본은 이 저장소 Formula/rustograph.rb — 자리표시자만 채워 탭에 둔다.
          sed -e "s|@TAG@|${TAG}|g" \
              -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@SHA_DARWIN_ARM64@|$(sha darwin-arm64.tar.gz)|" \
              -e "s|@SHA_DARWIN_AMD64@|$(sha darwin-amd64.tar.gz)|" \
              -e "s|@SHA_LINUX_ARM64@|$(sha linux-arm64.tar.gz)|" \
              -e "s|@SHA_LINUX_AMD64@|$(sha linux-amd64.tar.gz)|" \
              Formula/rustograph.rb > tap/Formula/rustograph.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rustograph.rb
          git commit -m "rustograph ${VERSION}"
          git push
