name: ci

on:
  push:
    branches: [main]
  pull_request:

# CI는 저장소에 쓰지 않는다 — 토큰은 읽기 전용이고 checkout은 토큰을 .git/config에 남기지 않는다.
# 액션은 커밋 SHA로 고정한다(주석은 고정 시점의 태그) — 갱신은 Dependabot이 제안한다.
permissions:
  contents: read

jobs:
  release-assets:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Windows'
        run: bash scripts/test-release-build-manifest.sh
        shell: bash
      - if: runner.os != 'Windows'
        run: |
          /bin/bash scripts/test-release-build-manifest.sh
          /bin/bash scripts/test-publish-release-assets.sh
        shell: bash

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 러너 디스크 여유 — 이 잡은 semantic 테스트 빌드와 커버리지 계측 빌드를 한 디스크에 쌓는다.
      - name: Disk usage at job start
        run: df -h
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov

      - run: cargo build --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo test --locked --features semantic
      # 커버리지는 cargo-llvm-cov가 target/llvm-cov-target에 계측 빌드를 새로 만들고 앞 단계의 target/
      # 산출물(semantic 테스트 바이너리 포함)은 쓰지 않는다 — 지워서 그 빌드가 디스크를 다 쓰지 않게 한다.
      # 잡에 target 캐시가 없고, 뒤 단계(verify-cli-contract.sh·cargo run)는 필요한 것을 다시 빌드한다.
      - name: Free target/ before coverage
        run: |
          df -h
          du -sh target
          cargo clean
          df -h
      - run: scripts/coverage.sh
      - run: scripts/verify-cli-contract.sh

      # 도그푸딩 — 이 도구로 이 저장소를 분석한다
      - run: cargo run --locked --quiet -- rules --strict
      - run: cargo run --locked --quiet -- cycles --level symbol --strict
      # dead는 0이 아니라 알려진 목록(scripts/self-dead.expected)과 같은지 본다 — 새 unreachable은
      # 수확 회귀이거나 진짜 미사용이고, 사라진 항목은 목록을 줄여야 한다.
      - run: scripts/verify-self-dead.sh

  # semantic feature의 코드(sem.rs)는 기본 clippy가 컴파일하지 않는다 — 따로 lint한다. test 잡과 디스크를
  # 나누지 않도록 별도 러너에서 돈다.
  semantic-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --locked --all-targets --features semantic -- -D warnings

  # Cargo.toml의 rust-version과 같은 최소 툴체인 — 선언한 MSRV가 실제로 빌드되는지 본다. 1.96을 정하는
  # 것은 semantic feature다(ra_ap_tt의 std::assert_matches). clippy·테스트는 test 잡이 stable에서 돌린다.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --all-targets --features semantic

  windows-output-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo test --locked --test snapshot_safety
      - run: cargo test --locked export::tests
