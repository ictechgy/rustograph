[package]
name = "rustograph"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Queryable dependency graph for Rust codebases — the graph is the artifact; everything else is a query over it"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_yml = "0.0.12"
