[package]
name = "rustograph"
version = "0.6.0"
edition = "2021"
# 최소 지원 Rust — semantic feature가 정한다. ra_ap_* 0.0.349는 rust-version 1.95를 선언하지만
# ra_ap_tt가 1.95에서 불안정한 `std::assert_matches`를 써서(E0658) 1.96부터 빌드된다. 기본 빌드는 더 낮은
# 툴체인에서도 될 수 있지만 rust-version은 패키지 단위라 두 빌드가 함께 되는 1.96을 선언한다. CI msrv
# 잡이 이 툴체인으로 기본·semantic 빌드를 확인한다.
rust-version = "1.96"
license = "MIT"
description = "Queryable dependency graph for Rust codebases — the graph is the artifact; everything else is a query over it"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 변경 캡처의 데이터 전용 Cargo 설정을 TOML 문법 그대로 검증한다. Cargo.lock의 기존 parser pin을 재사용한다.
toml = { version = "=1.1.6", default-features = false, features = ["parse", "display", "serde", "std"] }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# YAML 파서는 config 안에서만 쓴다. serde_yml·libyml은 RUSTSEC-2025-0068·0067
# (unsound·unmaintained, 패치 없음)이라 권고 대안인 serde_norway(유지되는
# serde_yaml 포크, 백엔드 unsafe-libyaml-norway)를 쓴다. serde_yaml_ng는 권고상
# 미유지 백엔드(unsafe-libyaml)를 써서 고르지 않았다.
serde_norway = "0.9.42"
# ra_ap_*는 주 단위로 API가 바뀌어 exact pin이다. 0.0.350부터 rust-version이
# 1.98로 올라가 현재 최소 toolchain(rustc 1.96)과 어긋나 0.0.349를 쓴다.
# Cargo.lock의 salsa 0.28.2·salsa-macro-rules 0.28.2·unicode-ident 1.0.24
# 핀도 이 버전 세트에 맞춘 것이다 — `cargo update`로만 바꾸면 ra_ap가
# 깨진다(salsa-macro-rules/unicode 버전 결합이 코드 생성에 박혀 있다).
ra_ap_load-cargo = { version = "=0.0.349", optional = true }
ra_ap_hir = { version = "=0.0.349", optional = true }
ra_ap_ide_db = { version = "=0.0.349", optional = true }
ra_ap_syntax = { version = "=0.0.349", optional = true }
ra_ap_project_model = { version = "=0.0.349", optional = true }
ra_ap_vfs = { version = "=0.0.349", optional = true }
ra_ap_proc_macro_api = { version = "=0.0.349", optional = true }
ra_ap_hir_expand = { version = "=0.0.349", optional = true }

[features]
# rust-analyzer(ra_ap_*) 의미 해석 엔진 — 타입 해석된 메서드 호출, 매크로
# 확장, trait impl 행렬. 의존이 크고 주 단위로 API가 바뀌어 opt-in이다.
# 켜면 --semantic 플래그가 동작한다.
semantic = [
    "dep:ra_ap_load-cargo",
    "dep:ra_ap_hir",
    "dep:ra_ap_ide_db",
    "dep:ra_ap_syntax",
    "dep:ra_ap_project_model",
    "dep:ra_ap_vfs",
    "dep:ra_ap_proc_macro_api",
    "dep:ra_ap_hir_expand",
]
